server {
    listen 80;
    server_name localhost;
    index index.php;
    root /var/www/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;

    # Intentar servir archivo directamente, si no existe, enviar a index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    # No loggear favicon ni robots.txt
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt { access_log off; log_not_found off; }
    # Página de error personalizada
    error_page 404 /index.php;
    # Procesar archivos PHP con PHP-FPM
    location ~ \.php$ {
        fastcgi_pass app:9000; # 'app' es el nombre del servicio PHP-FPM
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }
    # Denegar acceso a archivos ocultos (excepto .well-known)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
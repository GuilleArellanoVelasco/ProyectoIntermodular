services:
  # PHP-FPM
  app:
    build:
      context: ./src
      dockerfile: ../Dockerfile
    container_name: app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./src:/var/www
      - app_vendor:/var/www/vendor   # vendor en volumen Linux nativo, no en bind mount lento
    networks:
      - red
    depends_on:
      - postgres

  # Nginx (separado)
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - red
    depends_on:
      - app
  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - red

  # Node.js (para compilar assets bajo demanda: `docker compose run --rm node`)
  node:
    image: node:22-alpine
    container_name: node
    working_dir: /var/www
    volumes:
      - ./src:/var/www
      - node_modules:/var/www/node_modules
    command: sh -c "npm install && npm run build"
    networks:
      - red
    profiles:
      - build

networks:
  red:
    driver: bridge

volumes:
  postgres_data:
    name: liberxoDB
    driver: local
  node_modules:
    name: liberxo_node_modules
    driver: local
  app_vendor:
    name: liberxo_app_vendor
    driver: local